<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BetterViewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #18181b;
        --hover: rgba(255, 255, 255, 0.07);
        --line: rgba(255, 255, 255, 0.08);
        --text: #ececee;
        --muted: #8e8e96;
        --focus: #3b82f6;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --hover: rgba(0, 0, 0, 0.05);
          --line: rgba(0, 0, 0, 0.08);
          --text: #18181b;
          --muted: #71717a;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 272px;
        padding: 6px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px 10px;
      }
      header img {
        width: 20px;
        height: 20px;
      }
      header strong {
        flex: 1;
        font-size: 13.5px;
        font-weight: 600;
      }
      header span {
        color: var(--muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      hr {
        height: 1px;
        margin: 4px 4px;
        border: 0;
        background: var(--line);
      }
      button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--hover);
      }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      svg {
        flex: none;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button:hover:not(:disabled) svg {
        stroke: var(--text);
      }
      .label {
        flex: 1;
        white-space: nowrap;
      }
      .hint {
        color: var(--muted);
        font-size: 11.5px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <img alt="" src="icons/icon-32.png" />
      <strong>BetterViewer</strong>
      <span id="version"></span>
    </header>
    <hr />

    <button id="open" type="button">
      <svg viewBox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21" /></svg>
      <span class="label">Open BetterViewer</span>
    </button>
    <button id="screenshot" type="button">
      <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></svg>
      <span class="label">Screenshot this page</span>
      <span class="hint" data-command="take-screenshot"></span>
    </button>
    <button id="gallery" type="button">
      <svg viewBox="0 0 24 24"><rect height="7" rx="1" width="7" x="3" y="3" /><rect height="7" rx="1" width="7" x="14" y="3" /><rect height="7" rx="1" width="7" x="14" y="14" /><rect height="7" rx="1" width="7" x="3" y="14" /></svg>
      <span class="label">Browse page images</span>
      <span class="hint" data-command="open-gallery"></span>
    </button>

    <hr />

    <button id="settings" type="button">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
      <span class="label">Settings</span>
    </button>
    <button id="shortcuts" type="button">
      <svg viewBox="0 0 24 24"><path d="M10 8h.01" /><path d="M12 12h.01" /><path d="M14 8h.01" /><path d="M16 12h.01" /><path d="M18 8h.01" /><path d="M6 8h.01" /><path d="M7 16h10" /><path d="M8 12h.01" /><rect height="16" rx="2" width="20" x="2" y="4" /></svg>
      <span class="label">Keyboard shortcuts</span>
    </button>
    <button id="about" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
      <span class="label">About BetterViewer</span>
    </button>

    <script src="popup.js"></script>
  </body>
</html>
